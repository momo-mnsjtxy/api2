[package]
name = "api2"
version = "0.1.0"
edition = "2021"
description = "1:1 Rust rewrite of oldapi (ThinkPHP) — no PHP runtime"

[dependencies]
anyhow = "=1.0.95"
axum = { version = "=0.7.9", features = ["multipart", "macros"] }
axum-extra = { version = "=0.9.6", features = ["cookie"] }
base64 = "=0.22.1"
chrono = { version = "=0.4.39", features = ["serde"] }
dotenvy = "=0.15.7"
hex = "=0.4.3"
image = { version = "=0.25.5", default-features = false, features = ["jpeg", "png", "gif"] }
md-5 = "=0.10.6"
moka = { version = "=0.12.8", features = ["future"] }
qrcode = "=0.14.1"
rand = "=0.8.5"
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls", "gzip", "multipart"] }
serde = { version = "=1.0.216", features = ["derive"] }
serde_json = "=1.0.134"
serde_urlencoded = "=0.7.1"
sqlx = { version = "=0.8.2", features = ["runtime-tokio-rustls", "mysql", "chrono"] }
thiserror = "=1.0.69"
time = "=0.3.37"
tokio = { version = "=1.42.0", features = ["full"] }
tower = "=0.5.1"
tower-http = { version = "=0.5.2", features = ["fs", "trace", "cors"] }
tower-sessions = "=0.12.0"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter"] }
urlencoding = "=2.1.3"
uuid = { version = "=1.11.0", features = ["v4"] }

# Transitive MSRV pins for Rust/Cargo 1.83.
async-lock = "=3.3.0"
base64ct = "=1.6.0"
hashbrown = "=0.15.2"
home = "=0.5.9"
indexmap = "=2.7.0"
tempfile = "=3.14.0"
url = "=2.5.0"
zeroize = "=1.8.1"
regex = "=1.13.1"

[profile.release]
lto = true
codegen-units = 1
